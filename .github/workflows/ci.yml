name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build shared package
        run: npm run build --workspace=@mono/shared

      - name: Generate Prisma clients
        run: |
          npx prisma generate --schema=services/ingestion/prisma/schema.prisma
          npx prisma generate --schema=services/transformation/prisma/schema.prisma
          npx prisma generate --schema=services/reporting/prisma/schema.prisma

      - name: Lint
        run: npm run lint

      - name: Build all services
        run: npm run build

      - name: Run tests
        run: npm test
